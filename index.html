<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f172a" />
<meta name="description" content="现代风格的贪吃蛇小游戏，支持键盘和触屏滑动控制。" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="贪吃蛇" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" href="favicon-32.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<title>贪吃蛇 · Snake</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #1e1b4b;
    --panel: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.12);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22d3ee;
    --accent-2: #818cf8;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.18), transparent 34%),
      radial-gradient(circle at 85% 80%, rgba(129, 140, 248, 0.20), transparent 38%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .game {
    width: min(94vw, 470px);
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 22px;
    box-shadow: 0 24px 70px rgba(2, 6, 23, 0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
  }

  h1 {
    margin: 0;
    font-size: clamp(22px, 5vw, 30px);
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .scores {
    display: flex;
    gap: 10px;
  }

  .score {
    min-width: 78px;
    padding: 9px 12px;
    text-align: center;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
  }

  .score span {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .score strong {
    display: block;
    margin-top: 3px;
    font-size: 20px;
    font-weight: 700;
  }

  .board-wrap {
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    background: #0b1120;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06), 0 14px 34px rgba(2, 6, 23, 0.45);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
    text-align: center;
    background: rgba(8, 12, 26, 0.66);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }

  .overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .overlay h2 {
    margin: 0;
    font-size: clamp(26px, 6vw, 36px);
  }

  .overlay p {
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
  }

  .overlay .final-score {
    font-size: 46px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  button {
    appearance: none;
    border: 0;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }

  .btn {
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #08131f;
    box-shadow: 0 10px 24px rgba(34, 211, 238, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow: 0 14px 30px rgba(34, 211, 238, 0.35);
  }

  .btn:active {
    transform: translateY(0);
    filter: brightness(0.95);
  }

  .btn.ghost {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--border);
    color: var(--text);
    box-shadow: none;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }

  .controls button {
    flex: 1;
  }

  .hint {
    margin: 16px 0 0;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
  }

  .hint b {
    color: var(--text);
    font-weight: 600;
  }

  @media (max-width: 420px) {
    body {
      padding: 14px;
    }

    .card {
      padding: 16px;
      border-radius: 22px;
    }

    .score {
      min-width: 68px;
    }
  }
</style>
</head>
<body>
  <main class="game">
    <div class="card">
      <header class="header">
        <h1>贪吃蛇</h1>
        <div class="scores">
          <div class="score">
            <span>得分</span>
            <strong id="score">0</strong>
          </div>
          <div class="score">
            <span>最高分</span>
            <strong id="highScore">0</strong>
          </div>
        </div>
      </header>

      <div class="board-wrap">
        <canvas id="gameCanvas" width="480" height="480" aria-label="贪吃蛇游戏区域"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">准备开始</h2>
          <p id="overlayText">使用方向键或滑动屏幕控制方向</p>
          <button class="btn" id="overlayBtn">开始游戏</button>
        </div>
      </div>

      <div class="controls">
        <button class="btn ghost" id="pauseBtn">暂停</button>
        <button class="btn ghost" id="restartBtn">重新开始</button>
      </div>

      <p class="hint">
        <b>键盘：</b>方向键 / WASD，空格暂停 · <b>手机：</b>在棋盘上滑动
      </p>
    </div>
  </main>

<script>
  (function () {
    "use strict";

    const GRID = 20;
    const CELL = 24; // 480 / 20
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highScoreEl = document.getElementById("highScore");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const overlayBtn = document.getElementById("overlayBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");

    let snake, direction, pendingDirection, food, score, state, stepInterval, accumulator, lastTime;
    let highScore = Number(localStorage.getItem("snakeHighScore") || 0);
    highScoreEl.textContent = highScore;

    const HEAD_COLOR = { r: 52, g: 211, b: 153 };
    const TAIL_COLOR = { r: 129, g: 140, b: 248 };

    function reset() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      pendingDirection = null;
      score = 0;
      stepInterval = 135;
      accumulator = 0;
      scoreEl.textContent = "0";
      placeFood();
      state = "ready";
      renderOverlay();
    }

    function placeFood() {
      do {
        food = {
          x: Math.floor(Math.random() * GRID),
          y: Math.floor(Math.random() * GRID)
        };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function setDirection(dx, dy) {
      if (dx === -direction.x && dy === -direction.y) return;
      if (dx === direction.x && dy === direction.y) return;
      pendingDirection = { x: dx, y: dy };
    }

    function start() {
      if (state === "gameover") reset();
      state = "running";
      renderOverlay();
      updatePauseButton();
    }

    function pause() {
      if (state !== "running") return;
      state = "paused";
      renderOverlay();
      updatePauseButton();
    }

    function resume() {
      if (state !== "paused") return;
      state = "running";
      lastTime = performance.now();
      accumulator = 0;
      renderOverlay();
      updatePauseButton();
    }

    function togglePause() {
      if (state === "running") pause();
      else if (state === "paused") resume();
    }

    function gameOver() {
      state = "gameover";
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("snakeHighScore", String(highScore));
        highScoreEl.textContent = highScore;
      }
      renderOverlay();
      updatePauseButton();
    }

    function updatePauseButton() {
      pauseBtn.textContent = state === "paused" ? "继续" : "暂停";
    }

    function renderOverlay() {
      if (state === "running") {
        overlay.classList.add("hidden");
        return;
      }

      overlay.classList.remove("hidden");
      if (state === "ready") {
        overlayTitle.textContent = "准备开始";
        overlayText.innerHTML = "使用方向键或滑动屏幕控制方向";
        overlayBtn.textContent = "开始游戏";
      } else if (state === "paused") {
        overlayTitle.textContent = "已暂停";
        overlayText.innerHTML = "按空格或点击“继续”回到游戏";
        overlayBtn.textContent = "继续游戏";
      } else {
        overlayTitle.textContent = "游戏结束";
        overlayText.innerHTML = "本次得分";
        overlayText.insertAdjacentHTML("beforeend", '<br><span class="final-score">' + score + "</span>");
        overlayBtn.textContent = "再来一局";
      }
    }

    function step() {
      if (pendingDirection) {
        direction = pendingDirection;
        pendingDirection = null;
      }

      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y
      };

      const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
      const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);

      if (hitWall || hitSelf) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = score;
        stepInterval = Math.max(65, 135 - score * 2);
        placeFood();
      } else {
        snake.pop();
      }
    }

    function draw(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 背景
      ctx.fillStyle = "#0b1120";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 网格
      ctx.strokeStyle = "rgba(148, 163, 184, 0.08)";
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // 食物
      const pulse = 1 + Math.sin(now / 260) * 0.12;
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const fr = CELL * 0.34 * pulse;

      ctx.save();
      ctx.shadowColor = "rgba(244, 63, 94, 0.9)";
      ctx.shadowBlur = 16;
      const foodGradient = ctx.createRadialGradient(fx - 3, fy - 3, 1, fx, fy, fr);
      foodGradient.addColorStop(0, "#fda4af");
      foodGradient.addColorStop(1, "#e11d48");
      ctx.fillStyle = foodGradient;
      ctx.beginPath();
      ctx.arc(fx, fy, fr, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 蛇身：从尾部画到头部，头部最后覆盖
      for (let i = snake.length - 1; i >= 0; i--) {
        const segment = snake[i];
        const ratio = snake.length === 1 ? 0 : i / (snake.length - 1);
        const r = Math.round(TAIL_COLOR.r + (HEAD_COLOR.r - TAIL_COLOR.r) * ratio);
        const g = Math.round(TAIL_COLOR.g + (HEAD_COLOR.g - TAIL_COLOR.g) * ratio);
        const b = Math.round(TAIL_COLOR.b + (HEAD_COLOR.b - TAIL_COLOR.b) * ratio);

        const x = segment.x * CELL;
        const y = segment.y * CELL;
        const inset = i === 0 ? 2 : 3;
        const radius = i === 0 ? 9 : 7;

        ctx.fillStyle = "rgb(" + r + "," + g + "," + b + ")";
        roundRect(x + inset, y + inset, CELL - inset * 2, CELL - inset * 2, radius);
        ctx.fill();

        if (i === 0) drawEyes(segment);
      }
    }

    function drawEyes(head) {
      const x = head.x * CELL + CELL / 2;
      const y = head.y * CELL + CELL / 2;
      const neck = snake[1] || { x: head.x - direction.x, y: head.y - direction.y };
      const dx = head.x - neck.x || direction.x;
      const dy = head.y - neck.y || direction.y;

      const leftX = x + dy * 6 - dx * 2;
      const leftY = y - dx * 6 - dy * 2;
      const rightX = x - dy * 6 - dx * 2;
      const rightY = y + dx * 6 - dy * 2;

      ctx.fillStyle = "#0b1120";
      ctx.beginPath();
      ctx.arc(leftX, leftY, 2.4, 0, Math.PI * 2);
      ctx.arc(rightX, rightY, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function loop(now) {
      const dt = now - lastTime;
      lastTime = now;

      if (state === "running") {
        accumulator += dt;
        while (accumulator >= stepInterval) {
          accumulator -= stepInterval;
          step();
          if (state !== "running") break;
        }
      }

      draw(now);
      requestAnimationFrame(loop);
    }

    // 键盘控制
    window.addEventListener("keydown", function (event) {
      const key = event.key;

      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(key)) {
        event.preventDefault();
      }

      if (key === "ArrowUp" || key.toLowerCase() === "w") setDirection(0, -1);
      else if (key === "ArrowDown" || key.toLowerCase() === "s") setDirection(0, 1);
      else if (key === "ArrowLeft" || key.toLowerCase() === "a") setDirection(-1, 0);
      else if (key === "ArrowRight" || key.toLowerCase() === "d") setDirection(1, 0);
      else if (key === " ") togglePause();
      else if (key === "Enter" && (state === "ready" || state === "gameover")) start();
    });

    // 触屏滑动控制
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener("touchstart", function (event) {
      const touch = event.touches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
    }, { passive: true });

    canvas.addEventListener("touchmove", function (event) {
      event.preventDefault();
    }, { passive: false });

    canvas.addEventListener("touchend", function (event) {
      if (state === "ready") start();
      if (state !== "running") return;

      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;

      if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        setDirection(dx > 0 ? 1 : -1, 0);
      } else {
        setDirection(0, dy > 0 ? 1 : -1);
      }
    }, { passive: true });

    overlayBtn.addEventListener("click", function () {
      if (state === "ready" || state === "gameover") start();
      else if (state === "paused") resume();
    });

    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", function () {
      reset();
      start();
    });

    reset();
    lastTime = performance.now();
    requestAnimationFrame(loop);
  })();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js");
    });
  }
</script>
</body>
</html>

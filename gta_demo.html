<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>3D 小镇射击 Demo</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1120; }
  body { font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; color: #e2e8f0; }

  #game-container { position: fixed; inset: 0; }
  #game-container canvas { display: block; }

  .hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  #top-left {
    position: absolute; left: 20px; top: 20px;
    display: flex; flex-direction: column; gap: 12px;
    width: 240px;
  }

  .panel {
    background: rgba(10, 15, 28, 0.78);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 12px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 30px rgba(2, 6, 23, 0.45);
  }

  #healthWrap { position: relative; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.10); overflow: hidden; border: 1px solid rgba(255,255,255,0.16); }
  #healthBar { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); border-radius: 999px; transition: width .2s ease; }
  #healthText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }

  #weaponBox { display: flex; align-items: center; gap: 12px; }
  #weaponIcon { width: 96px; height: 54px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); }
  #weaponName { display: block; font-size: 17px; font-weight: 800; }
  #weaponInfo { display: block; margin-top: 4px; font-size: 12px; color: #94a3b8; }

  #crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 26px; height: 26px; transform: translate(-50%, -50%);
    color: #ffffff; font-size: 26px; line-height: 26px; text-align: center;
    text-shadow: 0 0 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.5);
    opacity: 0.9;
  }

  #minimap {
    position: absolute; right: 20px; bottom: 20px;
    width: 180px; height: 180px;
    border-radius: 18px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(10, 15, 28, 0.82);
    box-shadow: 0 12px 30px rgba(2, 6, 23, 0.45);
  }

  #hint {
    position: absolute; left: 50%; bottom: 20px;
    transform: translateX(-50%);
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(10, 15, 28, 0.66);
    border: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 12px; color: #cbd5e1;
  }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6, 10, 22, 0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    pointer-events: auto; cursor: pointer;
  }
  #overlay.hidden { display: none; }

  .overlay-card { text-align: center; max-width: 420px; padding: 30px; }
  .overlay-card h1 { margin: 0 0 14px; font-size: 34px; background: linear-gradient(90deg, #22d3ee, #818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overlay-card p { margin: 10px 0; color: #cbd5e1; line-height: 1.8; }
  .overlay-card .keys { color: #fbbf24; font-weight: 700; }
  .start-btn {
    display: inline-block; margin-top: 20px; padding: 13px 30px;
    border-radius: 999px; border: 0; cursor: pointer; font-size: 17px; font-weight: 800;
    color: #08131f; background: linear-gradient(90deg, #22d3ee, #818cf8);
    box-shadow: 0 12px 30px rgba(34, 211, 238, 0.3);
  }
</style>
</head>
<body>
  <div id="game-container"></div>

  <div class="hud">
    <div id="top-left">
      <div class="panel">
        <div id="healthWrap">
          <div id="healthBar"></div>
          <div id="healthText">100</div>
        </div>
      </div>
      <div class="panel" id="weaponBox">
        <canvas id="weaponIcon" width="96" height="54"></canvas>
        <div>
          <span id="weaponName">手枪</span>
          <span id="weaponInfo">伤害 34 · 单发</span>
        </div>
      </div>
    </div>

    <div id="crosshair">+</div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="hint">WASD 移动 · 鼠标左键射击 · 滚轮切换武器 · Shift 加速</div>
  </div>

  <div id="overlay">
    <div class="overlay-card">
      <h1>3D 小镇射击</h1>
      <p><span class="keys">WASD</span> 移动 &nbsp;·&nbsp; <span class="keys">鼠标</span> 转动视角</p>
      <p><span class="keys">左键</span> 射击 &nbsp;·&nbsp; <span class="keys">滚轮</span> 切换武器</p>
      <p><span class="keys">Shift</span> 加速奔跑 &nbsp;·&nbsp; 右上角地图，左上角血量/武器</p>
      <button class="start-btn" id="startBtn">点击开始</button>
    </div>
  </div>

<script src="three.min.js"></script>
<script>
(function () {
  "use strict";

  // ---------- 基础渲染 ----------
  const container = document.getElementById("game-container");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ec9e8);
  scene.fog = new THREE.Fog(0x9ec9e8, 50, 240);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 400);
  camera.rotation.order = "YXZ";
  camera.position.set(0, 1.7, 0);
  scene.add(camera);

  // 光照
  const hemi = new THREE.HemisphereLight(0xd9ecff, 0x3f5d3a, 0.9);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xfff2d0, 1.3);
  sun.position.set(60, 90, 40);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -130;
  sun.shadow.camera.right = 130;
  sun.shadow.camera.top = 130;
  sun.shadow.camera.bottom = -130;
  sun.shadow.camera.far = 300;
  sun.shadow.bias = -0.0004;
  scene.add(sun);

  // ---------- 地面和道路 ----------
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(520, 520),
    new THREE.MeshStandardMaterial({ color: 0x5b9a4e, roughness: 1, metalness: 0 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  function makeRoad(width, length, x, z, rotationY) {
    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(width, length),
      new THREE.MeshStandardMaterial({ color: 0x3c4048, roughness: 0.95 })
    );
    road.rotation.x = -Math.PI / 2;
    if (rotationY) road.rotation.z = rotationY;
    road.position.set(x, 0.03, z);
    road.receiveShadow = true;
    scene.add(road);
  }
  makeRoad(10, 520, 0, 0, 0);
  makeRoad(10, 520, 0, 0, Math.PI / 2);

  // ---------- 建筑 ----------
  const buildingGroups = [];
  const buildingBoxes = [];
  const wallColors = [0xb07a55, 0xa86f4b, 0xc38b5e, 0x8a9bb3, 0x9ca3af, 0xb58f68, 0x7f8ea8];

  function makeBuilding(x, z, w, h, d, color) {
    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      new THREE.MeshStandardMaterial({ color: color, roughness: 0.9 })
    );
    body.position.y = h / 2;
    body.castShadow = true;
    body.receiveShadow = true;
    group.add(body);

    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.5, 0.35, d + 0.5),
      new THREE.MeshStandardMaterial({ color: 0x2f3742, roughness: 0.8 })
    );
    roof.position.y = h + 0.18;
    roof.castShadow = true;
    group.add(roof);

    // 窗户
    const winMat = new THREE.MeshBasicMaterial({ color: 0x9bd8ff });
    const darkMat = new THREE.MeshBasicMaterial({ color: 0x26323f });
    const sides = [
      { px: w / 2 + 0.02, pz: 0, ry: Math.PI / 2 },
      { px: -w / 2 - 0.02, pz: 0, ry: -Math.PI / 2 },
      { px: 0, pz: d / 2 + 0.02, ry: 0 },
      { px: 0, pz: -d / 2 - 0.02, ry: Math.PI }
    ];
    for (const side of sides) {
      const cols = Math.max(2, Math.floor(w / 5));
      const rows = Math.max(2, Math.floor(h / 4));
      const stepX = w / (cols + 1);
      const stepY = h / (rows + 1);
      for (let i = 1; i <= cols; i++) {
        for (let j = 1; j <= rows; j++) {
          const win = new THREE.Mesh(
            new THREE.PlaneGeometry(1.1, 1.4),
            (i + j) % 3 === 0 ? darkMat : winMat
          );
          const lx = -w / 2 + stepX * i;
          const ly = 1.2 + stepY * (j - 1);
          if (side.ry === Math.PI / 2) { win.position.set(side.px, ly, lx); win.rotation.y = Math.PI / 2; }
          else if (side.ry === -Math.PI / 2) { win.position.set(side.px, ly, lx); win.rotation.y = -Math.PI / 2; }
          else if (side.ry === 0) { win.position.set(lx, ly, side.pz); }
          else { win.position.set(lx, ly, side.pz); win.rotation.y = Math.PI; }
          group.add(win);
        }
      }
    }

    group.position.set(x, 0, z);
    scene.add(group);
    buildingGroups.push(group);
    buildingBoxes.push(new THREE.Box3(
      new THREE.Vector3(x - w / 2, 0, z - d / 2),
      new THREE.Vector3(x + w / 2, h, z + d / 2)
    ));
  }

  // 街区布局：避开中心道路（x=0 和 z=0 是道路）
  const block = [
    [ 28,  28, 18, 10, 15], [ 55,  26, 22, 13, 18], [ 30,  62, 16, 12, 14], [ 62,  58, 24, 16, 22],
    [-28,  28, 20, 11, 16], [-55,  30, 16, 12, 13], [-30,  64, 22, 15, 18], [-62,  62, 18, 10, 15],
    [ 28, -28, 17, 12, 14], [ 56, -30, 21, 14, 17], [ 32, -60, 18, 13, 15], [ 60, -58, 24, 16, 20],
    [-28, -28, 19, 13, 15], [-56, -30, 22, 15, 18], [-32, -62, 17, 11, 14], [-60, -58, 20, 12, 16]
  ];
  for (let i = 0; i < block.length; i++) {
    makeBuilding(block[i][0], block[i][1], block[i][2], block[i][3], block[i][4], wallColors[i % wallColors.length]);
  }

  // 树木
  function makeTree(x, z) {
    const tree = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.4, 2.2, 8),
      new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1 })
    );
    trunk.position.y = 1.1;
    trunk.castShadow = true;
    const leaf = new THREE.Mesh(
      new THREE.ConeGeometry(1.7, 3.6, 8),
      new THREE.MeshStandardMaterial({ color: 0x2f7d46, roughness: 0.9 })
    );
    leaf.position.y = 3.6;
    leaf.castShadow = true;
    tree.add(trunk, leaf);
    tree.position.set(x, 0, z);
    scene.add(tree);
  }
  const treeSpots = [
    [-90, -90], [90, -90], [-90, 90], [90, 90],
    [-12, -12], [12, -12], [-12, 12], [12, 12],
    [-78, 40], [78, -40], [-40, -78], [40, 78]
  ];
  treeSpots.forEach(p => makeTree(p[0], p[1]));

  // ---------- NPC ----------
  const npcs = [];
  const shootTargets = [];
  const npcColors = [0xe2554d, 0x3f8ef7, 0xf5a623, 0x9b5de5, 0x22b8cf, 0xf472b6, 0x84cc16];

  function createNPC(color, x, z) {
    const group = new THREE.Group();
    const clothMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 });
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xe6b896, roughness: 0.8 });
    const darkMat = new THREE.MeshStandardMaterial({ color: 0x27323e, roughness: 0.9 });

    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.82, 0.36), clothMat);
    torso.position.y = 1.25;
    torso.castShadow = true;

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12), skinMat);
    head.position.y = 1.88;
    head.castShadow = true;

    const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.82, 0.26), darkMat);
    leftLeg.position.set(-0.17, 0.41, 0);
    leftLeg.castShadow = true;
    const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.82, 0.26), darkMat);
    rightLeg.position.set(0.17, 0.41, 0);
    rightLeg.castShadow = true;

    const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.68, 0.22), clothMat);
    leftArm.position.set(-0.42, 1.3, 0);
    leftArm.rotation.z = 0.12;
    leftArm.castShadow = true;
    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.68, 0.22), clothMat);
    rightArm.position.set(0.42, 1.3, 0);
    rightArm.rotation.z = -0.12;
    rightArm.castShadow = true;

    group.add(torso, head, leftLeg, rightLeg, leftArm, rightArm);
    group.position.set(x, 0, z);
    scene.add(group);

    const data = {
      hp: 100,
      maxHp: 100,
      alive: true,
      deadTime: 0,
      speed: 1.4 + Math.random() * 1.2,
      angle: Math.random() * Math.PI * 2,
      target: randomTarget(),
      wait: 0,
      walkTime: 0,
      flash: 0,
      mats: [clothMat, skinMat, darkMat],
      leftLeg: leftLeg,
      rightLeg: rightLeg
    };
    group.userData.npcData = data;
    npcs.push(group);
    shootTargets.push(group);
    return group;
  }

  function randomTarget() {
    return new THREE.Vector3((Math.random() - 0.5) * 170, 0, (Math.random() - 0.5) * 170);
  }

  const npcSpawns = [[18, 20], [-20, 18], [22, -22], [-24, -20], [6, 44], [-44, 6], [48, -6], [-6, -48]];
  for (let i = 0; i < npcSpawns.length; i++) {
    createNPC(npcColors[i % npcColors.length], npcSpawns[i][0], npcSpawns[i][1]);
  }

  // ---------- 玩家状态 ----------
  const player = { pos: new THREE.Vector3(0, 0, 0), vel: new THREE.Vector3(), radius: 0.55 };
  const eyeHeight = 1.7;
  const walkSpeed = 5.2;
  const runSpeed = 8.5;
  let yaw = 0;
  let pitch = 0;
  let playerHealth = 100;
  const keys = { w: false, a: false, s: false, d: false, shift: false };

  // ---------- 武器 ----------
  const weaponRoot = new THREE.Group();
  weaponRoot.position.set(0.26, -0.24, -0.55);
  camera.add(weaponRoot);

  const gunDark = new THREE.MeshStandardMaterial({ color: 0x1b222c, roughness: 0.5, metalness: 0.55 });
  const gunMid = new THREE.MeshStandardMaterial({ color: 0x3a4552, roughness: 0.45, metalness: 0.6 });
  const gunGrip = new THREE.MeshStandardMaterial({ color: 0x141a22, roughness: 0.7 });

  function box(w, h, d, mat, x, y, z) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    mesh.position.set(x, y, z);
    return mesh;
  }

  // 手枪模型
  const pistolModel = new THREE.Group();
  pistolModel.add(box(0.075, 0.1, 0.28, gunMid, 0, 0.04, -0.13));
  pistolModel.add(box(0.035, 0.035, 0.22, gunDark, 0, 0.075, -0.28));
  pistolModel.add(box(0.06, 0.17, 0.09, gunGrip, 0, -0.09, -0.02));
  weaponRoot.add(pistolModel);

  // 冲锋枪模型
  const smgModel = new THREE.Group();
  smgModel.add(box(0.075, 0.12, 0.42, gunMid, 0, 0.04, -0.12));
  smgModel.add(box(0.045, 0.045, 0.22, gunDark, 0, 0.06, -0.32));
  smgModel.add(box(0.06, 0.18, 0.11, gunGrip, 0, -0.11, 0.05));
  smgModel.add(box(0.07, 0.14, 0.12, gunDark, 0, 0.02, 0.16));
  smgModel.add(box(0.05, 0.2, 0.07, gunDark, 0, -0.13, -0.08));
  weaponRoot.add(smgModel);

  // 枪口闪光
  const glowTexture = makeGlowTexture();
  const muzzleFlash = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture, color: 0xffd27a, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
  }));
  muzzleFlash.scale.set(0.28, 0.28, 0.28);
  muzzleFlash.position.set(0, 0.06, -0.46);
  weaponRoot.add(muzzleFlash);
  muzzleFlash.visible = false;

  const muzzleLight = new THREE.PointLight(0xffb84d, 0, 7, 2);
  muzzleLight.position.set(0, 0.06, -0.46);
  weaponRoot.add(muzzleLight);

  const weapons = [
    { key: "pistol", name: "手枪", damage: 34, fireRate: 0.35, auto: false, info: "伤害 34 · 单发", model: pistolModel },
    { key: "smg", name: "冲锋枪", damage: 12, fireRate: 0.085, auto: true, info: "伤害 12 · 连发", model: smgModel }
  ];
  let weaponIndex = 0;

  function currentWeapon() { return weapons[weaponIndex]; }

  function switchWeapon(dir) {
    weaponIndex = (weaponIndex + dir + weapons.length) % weapons.length;
    updateWeaponUI();
  }

  function updateWeaponUI() {
    const w = currentWeapon();
    for (const weapon of weapons) weapon.model.visible = false;
    w.model.visible = true;
    document.getElementById("weaponName").textContent = w.name;
    document.getElementById("weaponInfo").textContent = w.info;
    drawWeaponIcon(w.key);
  }

  // ---------- 射击 ----------
  let mouseDown = false;
  let lastShot = 0;
  let recoil = 0;
  let flashTimer = 0;
  const sparks = [];
  const tracers = [];

  function shoot() {
    const now = performance.now() / 1000;
    const w = currentWeapon();
    if (now - lastShot < w.fireRate) return;
    lastShot = now;

    recoil = 1;
    flashTimer = 0.05;
    muzzleFlash.visible = true;
    muzzleLight.intensity = 4;
    playShotSound(w.key);

    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera({ x: 0, y: 0 }, camera);
    raycaster.far = 220;
    const interactive = [ground, ...shootTargets, ...buildingGroups];
    const hits = raycaster.intersectObjects(interactive, true);

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const fallback = camera.position.clone().addScaledVector(dir, 120);
    const muzzleWorld = new THREE.Vector3();
    muzzleFlash.getWorldPosition(muzzleWorld);

    let hitPoint = fallback.clone();

    if (hits.length > 0) {
      const hit = hits[0];
      hitPoint.copy(hit.point);
      let obj = hit.object;
      let npcGroup = null;
      while (obj) {
        if (obj.userData && obj.userData.npcData) { npcGroup = obj; break; }
        obj = obj.parent;
      }
      if (npcGroup) {
        damageNPC(npcGroup, w.damage);
      }
      addSpark(hitPoint);
    }

    addTracer(muzzleWorld, hitPoint);
  }

  function damageNPC(group, damage) {
    const data = group.userData.npcData;
    if (!data.alive) return;
    data.hp -= damage;
    data.flash = 0.12;
    if (data.hp <= 0) {
      data.hp = 0;
      data.alive = false;
      data.deadTime = 0;
      group.rotation.z = Math.PI / 2;
      group.position.y = 0.15;
    }
  }

  function addSpark(pos) {
    const mat = new THREE.SpriteMaterial({
      map: glowTexture, color: 0xffe08a, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true
    });
    const spark = new THREE.Sprite(mat);
    spark.position.copy(pos);
    spark.scale.setScalar(0.35);
    spark.userData.life = 0.22;
    scene.add(spark);
    sparks.push(spark);
  }

  function addTracer(from, to) {
    const geo = new THREE.BufferGeometry().setFromPoints([from.clone(), to.clone()]);
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: 0xffe08a, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
    }));
    line.userData.life = 0.07;
    scene.add(line);
    tracers.push(line);
  }

  // ---------- 声音 ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function playShotSound(kind) {
    if (!audioCtx) return;
    const duration = kind === "pistol" ? 0.14 : 0.07;
    const volume = kind === "pistol" ? 0.5 : 0.22;
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * duration, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / data.length;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.2);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = kind === "pistol" ? 1800 : 2400;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start();
  }

  // ---------- 输入 ----------
  document.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    if (k === "w" || k === "a" || k === "s" || k === "d") keys[k] = true;
    if (k === "shift") keys.shift = true;
  });
  document.addEventListener("keyup", function (e) {
    const k = e.key.toLowerCase();
    if (k === "w" || k === "a" || k === "s" || k === "d") keys[k] = false;
    if (k === "shift") keys.shift = false;
  });

  document.addEventListener("mousedown", function (e) {
    if (e.button !== 0) return;
    if (document.pointerLockElement === renderer.domElement) {
      mouseDown = true;
      if (!currentWeapon().auto) shoot();
    }
  });
  document.addEventListener("mouseup", function (e) {
    if (e.button === 0) mouseDown = false;
  });

  document.addEventListener("mousemove", function (e) {
    if (document.pointerLockElement !== renderer.domElement) return;
    yaw -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
  });

  document.addEventListener("wheel", function (e) {
    e.preventDefault();
    if (e.deltaY > 0) switchWeapon(1);
    else if (e.deltaY < 0) switchWeapon(-1);
  }, { passive: false });

  // ---------- 指针锁定 / 覆盖层 ----------
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.querySelector(".overlay-card h1");
  const startBtn = document.getElementById("startBtn");

  function requestLock() {
    ensureAudio();
    renderer.domElement.requestPointerLock();
  }
  startBtn.addEventListener("click", requestLock);

  document.addEventListener("pointerlockchange", function () {
    const locked = document.pointerLockElement === renderer.domElement;
    overlay.classList.toggle("hidden", locked);
    if (locked) {
      overlayTitle.textContent = "3D 小镇射击";
    } else {
      overlayTitle.textContent = "已暂停";
      mouseDown = false;
    }
  });

  // ---------- 碰撞 ----------
  function resolveCollision(p, radius) {
    for (const box of buildingBoxes) {
      const minX = box.min.x - radius;
      const maxX = box.max.x + radius;
      const minZ = box.min.z - radius;
      const maxZ = box.max.z + radius;
      if (p.x > minX && p.x < maxX && p.z > minZ && p.z < maxZ) {
        const cx = Math.max(box.min.x, Math.min(p.x, box.max.x));
        const cz = Math.max(box.min.z, Math.min(p.z, box.max.z));
        let dx = p.x - cx;
        let dz = p.z - cz;
        if (dx === 0 && dz === 0) {
          const pushX = p.x - box.min.x < box.max.x - p.x ? box.min.x - radius : box.max.x + radius;
          const pushZ = p.z - box.min.z < box.max.z - p.z ? box.min.z - radius : box.max.z + radius;
          if (Math.abs(p.x - pushX) < Math.abs(p.z - pushZ)) p.x = pushX;
          else p.z = pushZ;
        } else {
          const dist = Math.hypot(dx, dz) || 0.001;
          p.x = cx + (dx / dist) * radius;
          p.z = cz + (dz / dist) * radius;
        }
      }
    }
  }

  function updatePlayer(dt) {
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    if (forward.lengthSq() < 0.0001) forward.set(0, 0, -1);
    forward.normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const right = new THREE.Vector3().crossVectors(forward, up);

    const move = new THREE.Vector3();
    move.addScaledVector(forward, (keys.w ? 1 : 0) - (keys.s ? 1 : 0));
    move.addScaledVector(right, (keys.d ? 1 : 0) - (keys.a ? 1 : 0));
    if (move.lengthSq() > 0) move.normalize();

    const speed = keys.shift ? runSpeed : walkSpeed;
    const target = move.multiplyScalar(speed);
    const smooth = 1 - Math.exp(-11 * dt);
    player.vel.lerp(target, smooth);

    player.pos.addScaledVector(player.vel, dt);
    player.pos.x = Math.max(-105, Math.min(105, player.pos.x));
    player.pos.z = Math.max(-105, Math.min(105, player.pos.z));
    resolveCollision(player.pos, player.radius);

    camera.position.set(player.pos.x, eyeHeight, player.pos.z);
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;
  }

  // ---------- NPC 更新 ----------
  const npcTargetTemp = new THREE.Vector3();
  function updateNPCs(dt, time) {
    for (const group of npcs) {
      const data = group.userData.npcData;

      if (!data.alive) {
        data.deadTime += dt;
        if (data.deadTime > 3.5) {
          data.alive = true;
          data.hp = data.maxHp;
          group.rotation.z = 0;
          group.position.y = 0;
          group.position.x = (Math.random() - 0.5) * 150;
          group.position.z = (Math.random() - 0.5) * 150;
        }
        continue;
      }

      if (data.wait > 0) {
        data.wait -= dt;
      } else {
        npcTargetTemp.set(data.target.x, 0, data.target.z);
        const dx = data.target.x - group.position.x;
        const dz = data.target.z - group.position.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 1.2) {
          data.wait = 0.6 + Math.random() * 2;
          data.target = randomTarget();
        } else {
          const step = data.speed * dt;
          group.position.x += (dx / dist) * step;
          group.position.z += (dz / dist) * step;
          data.angle = Math.atan2(dx, dz);
          data.walkTime += dt * data.speed * 2.2;
          data.leftLeg.rotation.x = Math.sin(data.walkTime) * 0.5;
          data.rightLeg.rotation.x = -Math.sin(data.walkTime) * 0.5;
        }
      }

      resolveCollision(group.position, 0.45);
      group.position.x = Math.max(-105, Math.min(105, group.position.x));
      group.position.z = Math.max(-105, Math.min(105, group.position.z));
      group.rotation.y = data.angle;

      // 受击闪红
      if (data.flash > 0) {
        data.flash -= dt;
        const intensity = Math.max(0, data.flash / 0.12);
        for (const mat of data.mats) {
          mat.emissive.setRGB(0.9 * intensity, 0.08 * intensity, 0.08 * intensity);
        }
      } else {
        for (const mat of data.mats) mat.emissive.setRGB(0, 0, 0);
      }
    }
  }

  // ---------- 特效更新 ----------
  function updateEffects(dt) {
    if (flashTimer > 0) {
      flashTimer -= dt;
      muzzleFlash.visible = true;
      muzzleLight.intensity = 4;
    } else {
      muzzleFlash.visible = false;
      muzzleLight.intensity = 0;
    }

    recoil = Math.max(0, recoil - dt * 7);
    weaponRoot.position.z = -0.55 + recoil * 0.12;
    weaponRoot.rotation.x = recoil * 0.16;

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.userData.life -= dt;
      const k = Math.max(0, s.userData.life / 0.22);
      s.scale.setScalar(0.15 + k * 0.35);
      if (s.userData.life <= 0) {
        scene.remove(s);
        s.material.dispose();
        sparks.splice(i, 1);
      }
    }

    for (let i = tracers.length - 1; i >= 0; i--) {
      const t = tracers[i];
      t.userData.life -= dt;
      t.material.opacity = Math.max(0, t.userData.life / 0.07) * 0.9;
      if (t.userData.life <= 0) {
        scene.remove(t);
        t.geometry.dispose();
        t.material.dispose();
        tracers.splice(i, 1);
      }
    }
  }

  // ---------- 小地图 ----------
  const minimap = document.getElementById("minimap");
  const mapCtx = minimap.getContext("2d");
  const MAP_SIZE = 180;
  const WORLD = 220;
  const MAP_SCALE = MAP_SIZE / WORLD;

  function drawMinimap() {
    mapCtx.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
    mapCtx.fillStyle = "rgba(10, 15, 28, 0.82)";
    mapCtx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

    function toMap(x, z) {
      return [(x + WORLD / 2) * MAP_SCALE, (z + WORLD / 2) * MAP_SCALE];
    }

    // 道路
    mapCtx.strokeStyle = "rgba(148, 163, 184, 0.25)";
    mapCtx.lineWidth = 4;
    mapCtx.beginPath();
    mapCtx.moveTo(toMap(0, -110)[0], toMap(0, -110)[1]);
    mapCtx.lineTo(toMap(0, 110)[0], toMap(0, 110)[1]);
    mapCtx.moveTo(toMap(-110, 0)[0], toMap(-110, 0)[1]);
    mapCtx.lineTo(toMap(110, 0)[0], toMap(110, 0)[1]);
    mapCtx.stroke();

    // 建筑
    mapCtx.fillStyle = "rgba(203, 213, 225, 0.5)";
    for (const box of buildingBoxes) {
      const [x1, y1] = toMap(box.min.x, box.min.z);
      const [x2, y2] = toMap(box.max.x, box.max.z);
      mapCtx.fillRect(x1, y1, Math.max(2, x2 - x1), Math.max(2, y2 - y1));
    }

    // NPC
    for (const group of npcs) {
      const data = group.userData.npcData;
      const [mx, my] = toMap(group.position.x, group.position.z);
      mapCtx.fillStyle = data.alive ? "#ef4444" : "#475569";
      mapCtx.beginPath();
      mapCtx.arc(mx, my, 3.4, 0, Math.PI * 2);
      mapCtx.fill();
    }

    // 玩家箭头
    const [px, py] = toMap(player.pos.x, player.pos.z);
    mapCtx.save();
    mapCtx.translate(px, py);
    mapCtx.rotate(-yaw);
    mapCtx.fillStyle = "#22d3ee";
    mapCtx.beginPath();
    mapCtx.moveTo(0, -7);
    mapCtx.lineTo(5, 5);
    mapCtx.lineTo(0, 2);
    mapCtx.lineTo(-5, 5);
    mapCtx.closePath();
    mapCtx.fill();
    mapCtx.restore();
  }

  // ---------- 武器图标 ----------
  const weaponIconCanvas = document.getElementById("weaponIcon");
  const iconCtx = weaponIconCanvas.getContext("2d");
  function drawWeaponIcon(kind) {
    iconCtx.clearRect(0, 0, 96, 54);
    iconCtx.fillStyle = "rgba(255,255,255,0.06)";
    iconCtx.fillRect(0, 0, 96, 54);
    iconCtx.fillStyle = "#cbd5e1";
    if (kind === "pistol") {
      iconCtx.fillRect(32, 22, 34, 10);
      iconCtx.fillRect(30, 30, 10, 18);
      iconCtx.fillStyle = "#94a3b8";
      iconCtx.fillRect(64, 25, 12, 4);
    } else {
      iconCtx.fillRect(20, 20, 52, 11);
      iconCtx.fillRect(18, 29, 12, 16);
      iconCtx.fillRect(46, 29, 8, 17);
      iconCtx.fillStyle = "#94a3b8";
      iconCtx.fillRect(70, 22, 14, 6);
      iconCtx.fillRect(12, 18, 9, 7);
    }
  }

  function makeGlowTexture() {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, "rgba(255,255,255,1)");
    g.addColorStop(0.25, "rgba(255,220,120,0.9)");
    g.addColorStop(1, "rgba(255,160,40,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }

  // ---------- 主循环 ----------
  let lastTime = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    updatePlayer(dt);
    updateNPCs(dt, now / 1000);

    if (mouseDown && currentWeapon().auto && document.pointerLockElement === renderer.domElement) {
      shoot();
    }

    updateEffects(dt);
    drawMinimap();

    renderer.render(scene, camera);
  }

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 初始化
  updateWeaponUI();
  player.pos.set(0, 0, 0);
  camera.position.set(player.pos.x, eyeHeight, player.pos.z);
  requestAnimationFrame(animate);
})();
</script>
</body>
